name: CI — Reficio

on:
  push:
    branches: [main, deploy-secfix2]
  pull_request:
    branches: [main, deploy-secfix2]

jobs:
  quality:
    name: Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Run unit tests
        run: npx vitest run --project unit

      - name: Telegram bot bundle check
        run: npm run bot:build

      - name: Production build check
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXTAUTH_SECRET: "ci-build-secret-not-used-in-production"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build
