name: prosolutions

# Nota: los límites de memoria (mem_limit) solo están en docker-compose.yml
# (deploys locales desde el N5); los stacks de Portainer pueden ignorarlos,
# por eso este archivo no los fija.
services:
  app:
    image: ${APP_IMAGE:-prosolutions-app:latest}
    container_name: prosolutions-app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # El puerto solo se publica en loopback y en la IP LAN configurada
      # (APP_BIND_IP). El túnel de Cloudflare llega por la red interna de
      # Docker — no necesita puerto publicado. Publicar en 0.0.0.0 exponía
      # el origen vía Tailscale/otras interfaces y permitía forjar
      # CF-Connecting-IP para saltarse los rate limits.
      - "127.0.0.1:3005:3000"
      - "${APP_BIND_IP:-192.168.1.195}:3005:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with the current PostgreSQL credential}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Define a random session secret}
      AUTH_SECRET: ${NEXTAUTH_SECRET:?Define a random session secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Define the public HTTPS URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Define the existing bot token}
      CRON_SECRET: ${CRON_SECRET:?Define a random cron secret}
      PAYMENT_PROOFS_DIR: /app/storage/payment-proofs
      REPAIR_EVIDENCE_DIR: /app/storage/repair-evidence
      # Producción siempre va tras Cloudflare Tunnel: cloudflared sobrescribe
      # CF-Connecting-IP/X-Forwarded-For y el rate limit los usa para la IP real.
      TRUST_PROXY_HEADERS: "true"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@prosolutions.com}
      REFICIO_SIGNUP_ENABLED: ${REFICIO_SIGNUP_ENABLED:-false}
      # Verificación por correo (Resend) para altas nuevas: con key activa el
      # signup nace PENDING y se activa al verificar. Sin key solo aplica
      # Telegram; sin ningún canal el alta queda aprobada directo.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Reficio <noreply@reficio.app>}
      # Cifrado del PIN/patrón de equipos; si falta se deriva de NEXTAUTH_SECRET.
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY:-}
      # --- Opcionales que el código lee (defaults en código si se omiten) ---
      # Se listan EXPLÍCITAMENTE en vez de `env_file: .env.docker`: un
      # env_file (1) rompería los stacks de Portainer desplegados desde el
      # repo git — .env.docker está gitignored y no existe en el checkout —
      # y (2) inyectaría al contenedor toda variable que se añada al archivo
      # en el futuro (superficie de secretos visible en `docker inspect`).
      # Orígenes extra permitidos para requests mutadores (defensa Origin).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Username del bot (sin @) para deep-links t.me/<bot>?start=verify_*.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Tope del pool pg de Prisma (src/lib/prisma.ts; default 20).
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      # Retenciones/purgas: las corren los cron /api/cron/* de este servicio
      # y el bot (defaults y clamps en event-retention.ts y
      # pending-signup-purge.ts / delegation-reconcile.ts).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      PLATFORM_RETENTION_DAYS: ${PLATFORM_RETENTION_DAYS:-365}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
      DIRECTORY_RETENTION_DAYS: ${DIRECTORY_RETENTION_DAYS:-180}
      SIGNUP_PENDING_PURGE_DAYS: ${SIGNUP_PENDING_PURGE_DAYS:-30}
      PENDING_CUSTOMER_TTL_DAYS: ${PENDING_CUSTOMER_TTL_DAYS:-30}
      DELEGATION_RECONCILE_STALE_DAYS: ${DELEGATION_RECONCILE_STALE_DAYS:-30}
      # Secreto compartido para confiar en headers de proxy entrantes
      # (oleada en curso; vacío = feature apagada).
      TRUST_PROXY_SECRET: ${TRUST_PROXY_SECRET:-}
    volumes:
      - uploads:/app/public/uploads
      - payment_proofs:/app/storage/payment-proofs
      - repair_evidence:/app/storage/repair-evidence
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [prosolutions-network]

  bot:
    image: ${BOT_IMAGE:-prosolutions-bot:latest}
    container_name: prosolutions-bot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with the current PostgreSQL credential}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Define the existing bot token}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PAYMENT_PROOFS_DIR: /app/storage/payment-proofs
      # El bot corre las purgas de retención a diario (purgeOldEvents,
      # purgePendingSignups y reconcileDelegations en src/bot/index.ts) —
      # mismas vars opcionales que app, con los mismos defaults de código.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      PLATFORM_RETENTION_DAYS: ${PLATFORM_RETENTION_DAYS:-365}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
      DIRECTORY_RETENTION_DAYS: ${DIRECTORY_RETENTION_DAYS:-180}
      SIGNUP_PENDING_PURGE_DAYS: ${SIGNUP_PENDING_PURGE_DAYS:-30}
      PENDING_CUSTOMER_TTL_DAYS: ${PENDING_CUSTOMER_TTL_DAYS:-30}
      DELEGATION_RECONCILE_STALE_DAYS: ${DELEGATION_RECONCILE_STALE_DAYS:-30}
      # Heartbeat que verifica el healthcheck de abajo (find /tmp/bot-alive):
      # si se cambia aquí hay que actualizar el test del healthcheck también.
      BOT_HEARTBEAT_FILE: ${BOT_HEARTBEAT_FILE:-/tmp/bot-alive}
    volumes:
      - uploads:/app/public/uploads
      - payment_proofs:/app/storage/payment-proofs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El bot toca /tmp/bot-alive cada minuto (cron interno); si el archivo
      # envejece >3 min el proceso es un zombie aunque docker ps diga Up.
      test: ["CMD-SHELL", "find /tmp/bot-alive -mmin -3 | grep ."]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 90s
    networks: [prosolutions-network]

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: prosolutions-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: only app/bot and explicitly attached maintenance jobs can connect.
    environment:
      POSTGRES_USER: prosolutions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define the existing or coordinated rotated PostgreSQL password}
      POSTGRES_DB: prosolutions_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosolutions -d prosolutions_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [prosolutions-network]

  # Paso de migración explícito: corre `prisma migrate deploy` una vez y termina.
  # La imagen se construye con: docker compose -f docker-compose.yml --profile migrate build
  # Ejecutar ANTES de promover app/bot:
  #   docker compose -f docker-compose.portainer.yml -p prosolutions --env-file .env --profile migrate run --rm migrate
  # Si Portainer no respeta `profiles`, el servicio corre una vez al desplegar el
  # stack y queda en estado Exited (sin restart); eso es lo esperado.
  migrate:
    image: ${MIGRATE_IMAGE:-prosolutions-migrate:latest}
    profiles: ["migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [prosolutions-network]

networks:
  prosolutions-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: prosolutions_postgres_data
  uploads:
    external: true
    name: prosolutions_uploads
  payment_proofs:
    external: true
    name: prosolutions_payment_proofs
  repair_evidence:
    external: true
    name: prosolutions_repair_evidence
