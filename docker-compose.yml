name: prosolutions

services:
  app:
    image: ${APP_IMAGE:-prosolutions-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: prosolutions-app
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with the current PostgreSQL credential}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Define a random session secret}
      AUTH_SECRET: ${NEXTAUTH_SECRET:?Define a random session secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Define the public HTTPS URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Define the existing bot token}
      CRON_SECRET: ${CRON_SECRET:?Define a random cron secret}
      PAYMENT_PROOFS_DIR: /app/storage/payment-proofs
      REPAIR_EVIDENCE_DIR: /app/storage/repair-evidence
      # Producción siempre va tras Cloudflare Tunnel: cloudflared sobrescribe
      # CF-Connecting-IP/X-Forwarded-For y el rate limit los usa para la IP real.
      TRUST_PROXY_HEADERS: "true"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@prosolutions.com}
      REFICIO_SIGNUP_ENABLED: ${REFICIO_SIGNUP_ENABLED:-false}
      # Verificación por correo (Resend) para altas nuevas: con key activa el
      # signup nace PENDING y se activa al verificar. Sin key solo aplica
      # Telegram; sin ningún canal el alta queda aprobada directo.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Reficio <noreply@reficio.app>}
      # Cifrado del PIN/patrón de equipos; si falta se deriva de NEXTAUTH_SECRET.
      DEVICE_SECRET_KEY: ${DEVICE_SECRET_KEY:-}
    volumes:
      - uploads:/app/public/uploads
      - payment_proofs:/app/storage/payment-proofs
      - repair_evidence:/app/storage/repair-evidence
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [prosolutions-network]

  bot:
    image: ${BOT_IMAGE:-prosolutions-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: prosolutions-bot
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with the current PostgreSQL credential}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Define the existing bot token}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PAYMENT_PROOFS_DIR: /app/storage/payment-proofs
    volumes:
      - uploads:/app/public/uploads
      - payment_proofs:/app/storage/payment-proofs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El bot toca /tmp/bot-alive cada minuto (cron interno); si el archivo
      # envejece >3 min el proceso es un zombie aunque docker ps diga Up.
      test: ["CMD-SHELL", "find /tmp/bot-alive -mmin -3 | grep ."]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 90s
    networks: [prosolutions-network]

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: prosolutions-db
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No host port: only app/bot and explicitly attached maintenance jobs can connect.
    environment:
      POSTGRES_USER: prosolutions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define the existing or coordinated rotated PostgreSQL password}
      POSTGRES_DB: prosolutions_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosolutions -d prosolutions_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [prosolutions-network]

  migrate:
    image: ${MIGRATE_IMAGE:-prosolutions-migrate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [prosolutions-network]
    profiles: [migrate]

networks:
  prosolutions-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: prosolutions_postgres_data
  uploads:
    external: true
    name: prosolutions_uploads
  payment_proofs:
    external: true
    name: prosolutions_payment_proofs
  repair_evidence:
    external: true
    name: prosolutions_repair_evidence
